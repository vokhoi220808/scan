name: Daily Price Scan

on:
  schedule:
    - cron: "17 1 * * *"
    - cron: "15 14 * * *"
  workflow_dispatch:
    inputs:
      batch_size:
        description: "Batch size of games to scan"
        required: false
        default: "10000"

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run Standalone Price Scan
        run: |
          npm init -y
          npm install @neondatabase/serverless
          node .github/workflows/standalone-scan.js
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BATCH_SIZE: ${{ inputs.batch_size || '1000' }}
