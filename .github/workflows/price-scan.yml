name: Daily Price Scan (Cycle)

on:
  schedule:
    - cron: "17 2 * * *" # Runs daily at 02:17 UTC
  workflow_dispatch:
    inputs:
      part:
        description: "Part of the cycle to scan (1, 2, 3, or 4)"
        required: true
        default: "1"

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9.15.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Scan Engine
        run: pnpm exec tsx scanner/standalone-scan.ts --part=${{ inputs.part || '1' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
