name: Retry Failed Price Scans

on:
  schedule:
    - cron: "30 8 * * *"
  workflow_dispatch:

jobs:
  retry:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run Standalone Retry Scan
        run: |
          npm init -y
          npm install @neondatabase/serverless
          node .github/workflows/standalone-scan.js
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
